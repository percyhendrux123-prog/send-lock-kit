# Worker-in-wall test: Hermes config for the worker. FAKE MODEL ONLY.
# Mounted read-only into the worker at /opt/data/config.yaml (subpath of the guard
# volume). The model is the scripted fake behind the gateway's model route.
# The api_key value below is a placeholder that is not a credential; the gateway
# strips the Authorization header before forwarding anyway.
model:
  default: wiw-scripted-1
  provider: custom
  base_url: http://egress-gateway:8080/model/v1
  api_key: FAKE-NOT-A-CREDENTIAL
  api_mode: chat_completions
  context_length: 131072
terminal:
  backend: local
  cwd: /workspace
  timeout: 30
plugins:
  enabled: [send-lock]
platform_toolsets:
  cli: [terminal, file, skills, todo, tts]
disabled_toolsets: [browser, computer, phone, delegation, code_execution, web, messaging, discord, discord_admin, cronjob]
mcp_servers: {}
security:
  allow_lazy_installs: false
webapp:
  enabled: false
