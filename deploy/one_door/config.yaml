# Whole-agent-in-Docker model: local here means inside the isolated worker.
# No Docker daemon/socket is available to the worker.
terminal:
  backend: local
  cwd: /workspace
  timeout: 30
plugins:
  enabled: [send-lock]
platform_toolsets:
  cli: [terminal, file, skills, todo, tts]
  discord: [terminal, file, skills, todo, tts]
  telegram: [terminal, file, skills, todo, tts]
disabled_toolsets: [browser, computer, phone, delegation, code_execution, web, messaging, discord, discord_admin, cronjob]
mcp_servers: {}
security:
  allow_lazy_installs: false
webapp:
  enabled: false
